    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', 'Times New Roman', serif; background: #F0F4F8; color: #1E293B; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; }
        input, select { font-family: inherit; outline: none; border: none; }
        img { display: block; max-width: 100%; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #E2E8F0; }
        ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 4px; }
        :root {
            --primary: #1E293B; --secondary: #334155; --accent: #3B82F6; --accent-hover: #2563EB;

        .app { max-width: 1440px; margin: 0 auto; padding: 0 24px 60px; }
        .header {

            border-bottom: 2px solid var(--accent-light); flex-wrap: wrap; gap: 12px 20px;
            position: sticky; top: 0; background: rgba(248, 250, 252, 0.94); backdrop-filter: blur(10px); z-index: 100;
        }
        .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { width: 48px; height: 48px; object-fit: contain; mix-blend-mode: multiply; }
        .logo-text { font-size: 28px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-family: 'Georgia', serif; padding-right: 16px; }
        .nav-links { display: flex; gap: 24px; font-size: 15px; font-weight: 500; letter-spacing: 1px; color: var(--primary); }
        .nav-links a { padding: 4px 0; border-bottom: 2px solid transparent; transition: var(--transition); position: relative; }
        .nav-links a:hover, .nav-links a.active { border-bottom-color: var(--accent); color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 18px; }
        .search-wrap { display: flex; align-items: center; background: var(--warm-white); border-radius: 40px; padding: 4px 16px 4px 18px; border: 1px solid var(--border-color); transition: var(--transition); }
        .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
        .search-wrap input { background: transparent; padding: 8px 6px; font-size: 14px; width: 150px; color: var(--primary); }
        .search-wrap input::placeholder { color: #94A3B8; font-style: italic; }
        .search-wrap button { font-size: 18px; color: var(--secondary); padding: 4px 0 4px 8px; transition: var(--transition); }
        .search-wrap button:hover { color: var(--accent); }
        .icon-btn { font-size: 22px; position: relative; color: var(--primary); transition: var(--transition); padding: 4px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: var(--accent); transform: scale(1.05); }
        .badge { position: absolute; top: -6px; right: -8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Arial', sans-serif; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4); }
        .login-btn { background: var(--primary); color: #fff; padding: 8px 22px; border-radius: 40px; font-size: 14px; font-weight: 500; letter-spacing: 1px; transition: var(--transition); }
        .login-btn:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3); }

        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .hero { background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%); border-radius: var(--radius); padding: 60px 50px; color: #fff; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 30px; margin-bottom: 50px; position: relative; overflow: hidden; }
        .hero::after { content: ''; position: absolute; top: -40%; right: -10%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%); border-radius: 50%; }

        .hero-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4); background: var(--accent-hover); }

        .cat-card { background: var(--warm-white); border-radius: var(--radius); padding: 18px 10px; text-align: center; border: 1px solid var(--border-color); transition: var(--transition); cursor: pointer; font-weight: 500; letter-spacing: 0.5px; color: var(--primary); }
        .cat-card:hover { border-color: var(--accent); background: #fff; transform: translateY(-4px); box-shadow: var(--shadow); }

        .product-info .artist { font-size: 14px; color: var(--secondary); font-style: italic; margin-bottom: 6px; }
        .product-info .category-tag { display: inline-block; font-size: 11px; background: var(--accent-light); color: var(--primary); padding: 2px 12px; border-radius: 20px; letter-spacing: 0.5px; margin-bottom: 8px; }
        .product-info .price-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; flex-wrap: wrap; gap: 8px; }

        .add-cart-btn { background: var(--primary); color: #fff; padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; letter-spacing: 0.5px; transition: var(--transition); display: flex; align-items: center; gap: 6px; }
        .add-cart-btn:hover { background: var(--accent); transform: scale(1.03); }

        .cart-empty { text-align: center; padding: 60px 20px; color: var(--secondary); }

        .cart-empty h3 { font-size: 24px; color: var(--primary); margin-bottom: 6px; }
        .cart-item { display: flex; align-items: center; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .cart-item .ci-img { width: 80px; height: 80px; border-radius: 8px; flex-shrink: 0; background: var(--warm-white); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .cart-item .ci-img img { width: 100%; height: 100%; object-fit: contain; }
        .cart-item .ci-info { flex: 1; min-width: 150px; }
        .cart-item .ci-info h4 { font-size: 16px; font-weight: 600; }
        .cart-item .ci-info p { color: var(--secondary); font-size: 14px; }
        .cart-item .ci-qty { display: flex; align-items: center; gap: 10px; }
        .cart-item .ci-qty button { width: 30px; height: 30px; border-radius: 50%; background: var(--warm-white); border: 1px solid var(--border-color); font-size: 16px; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .cart-item .ci-qty button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .cart-item .ci-qty span { font-weight: 600; width: 24px; text-align: center; }

        .cart-total .checkout-btn { background: var(--accent); color: #fff; padding: 14px 44px; border-radius: 40px; font-size: 16px; font-weight: 600; letter-spacing: 1px; transition: var(--transition); }
        .cart-total .checkout-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.35); }
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; margin-bottom: 30px; }
        .wishlist-item { background: #fff; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-color); transition: var(--transition); }

        .wishlist-item .wi-info .wi-price { font-weight: 700; font-size: 17px; margin-top: 4px; }

        .login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 20px 0; }
        .login-box { background: #fff; border-radius: var(--radius); padding: 48px 40px 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border-color); }

        .login-box .logo-login h2 { font-size: 32px; letter-spacing: 3px; color: var(--primary); }
        .login-box .logo-login span { color: var(--accent); }
        .login-box .logo-login p { color: var(--secondary); font-style: italic; font-size: 14px; }

        .login-box input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; background: var(--warm-white); transition: var(--transition); color: var(--primary); }

        .login-box .login-submit { width: 100%; padding: 14px; background: var(--primary); color: #fff; border-radius: 40px; font-size: 16px; font-weight: 600; letter-spacing: 1px; margin-top: 24px; transition: var(--transition); }
        .login-box .login-submit:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.3); }
        .login-box .signup-link { text-align: center; margin-top: 18px; font-size: 14px; color: var(--secondary); }
        .login-box .signup-link a { color: var(--accent); font-weight: 600; cursor: pointer; }
        .login-box .signup-link a:hover { text-decoration: underline; }
        .login-error { color: #EF4444; font-size: 13px; margin-top: 6px; display: none; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: #fff; padding: 14px 28px; border-radius: 40px; font-size: 14px; box-shadow: 0 8px 30px rgba(30, 41, 59, 0.25); transform: translateY(80px); opacity: 0; transition: all 0.4s ease; z-index: 999; pointer-events: none; font-weight: 500; letter-spacing: 0.5px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        @media (max-width: 900px) {

        }
        @media (max-width: 540px) {

            .logo-text { font-size: 22px; padding-right: 10px; }

            .hero-content h1 { font-size: 26px; }

<body>
    <div class="app">
        <div class="toast" id="toast"></div>
        <header class="header">
            <a href="homepage.html" class="logo-wrap">
                <img src="logo.png" class="logo-img" alt="Just Art Logo" />
                <span class="logo-text">Just Art</span>
            </a>
            <nav class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="gallerypage.html" class="active">Gallery</a>
                <a href="wishlistpage.html">Wishlist</a>
                <a href="cartpage.html">Cart</a>
                <span id="adminNavSlot"></span>
            </nav>
            <div class="header-actions">
                <div class="search-wrap">
                    <input type="text" id="searchInput" placeholder="Search paintings…" />
                    <button id="searchBtn" aria-label="Search paintings">🔍</button>
                </div>
                <button class="icon-btn" onclick="location.href='wishlistpage.html'" aria-label="View wishlist">
                    ♡ <span class="badge" id="wishlistBadge">0</span>
                </button>
                <button class="icon-btn" onclick="location.href='cartpage.html'" aria-label="View cart">
                    🛒 <span class="badge" id="cartBadge">0</span>
                </button>
                <button class="login-btn" id="loginNavBtn">Sign In</button>
            </div>
        </header>

        <main class="page">
            <div class="section-header">
                <div>
                    <h1 class="section-title">All Paintings</h1>
                    <p class="section-sub" id="gallerySub">Explore our full collection</p>
                </div>
            </div>
            <div class="product-grid" id="galleryGrid"></div>
        </main>

        <footer style="text-align:center; padding:30px 0 20px; color:#94A3B8; font-size:13px; border-top:1px solid var(--border-color); margin-top:40px;">
            <p>&copy; 2026 Just Art. All rights reserved. | Original paintings from talented artists worldwide.</p>
            <nav aria-label="Footer navigation" style="margin-top:12px;display:flex;justify-content:center;gap:18px;font-size:13px;">
                <a href="homepage.html" style="color:#64748B;transition:color 0.3s;">Home</a>
                <a href="gallerypage.html" style="color:#64748B;transition:color 0.3s;">Gallery</a>
                <a href="cartpage.html" style="color:#64748B;transition:color 0.3s;">Cart</a>
                <a href="wishlistpage.html" style="color:#64748B;transition:color 0.3s;">Wishlist</a>
                <a href="signin.html" style="color:#64748B;transition:color 0.3s;">Sign In</a>
                <span id="adminFooterSlot"></span>
            </nav>
        </footer>
    </div>

    <script type="module">
        import { watchAuth, loadUserData, saveUserData, logOut, apiAddToCart, apiRemoveFromCart, apiAddToWishlist, apiRemoveFromWishlist, fetchPaintings, defaultPaintings, isUserAdmin } from './db-common.js';

        let paintings = [];

        function loadState(key, defaultVal) {
            try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : defaultVal; } catch { return defaultVal; }
        }
        function saveState(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

        let cart = loadState('justart_cart', []);
        let wishlist = loadState('justart_wishlist', []);
        let currentUser = null;
        let isLoggedIn = false;

        async function persist() {
            saveState('justart_cart', cart);
            saveState('justart_wishlist', wishlist);
            if (currentUser) {
                try { await saveUserData(currentUser.uid, { cart, wishlist }); }
                catch (e) {
                    console.error('Save failed', e);
                    showToast('⚠️ Could not sync to your account — saved locally only.');
                }
            }
        }

        const $ = id => document.getElementById(id);
        const toastEl = $('toast');
        const cartBadge = $('cartBadge');
        const wishlistBadge = $('wishlistBadge');
        const loginBtn = $('loginNavBtn');
        const searchInput = $('searchInput');
        const searchBtn = $('searchBtn');
        const galleryGrid = $('galleryGrid');
        const gallerySub = $('gallerySub');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2600);
        }

        function formatPrice(n) { return '$' + Number(n).toLocaleString('en-US'); }
        function getPainting(id) { return paintings.find(p => p.id === id); }
        function isInCart(id) { return cart.some(i => i.id === id); }
        function isInWishlist(id) { return wishlist.some(i => i.id === id); }
        function getCartCount() { return cart.reduce((sum, i) => sum + i.qty, 0); }

        function renderProductCard(p) {
            const inCart = isInCart(p.id);
            const inWish = isInWishlist(p.id);
            return `
                <div class="product-card" data-id="${p.id}">
                    <div class="product-img">
                        <img src="${p.image}" alt="${p.title}" loading="lazy" />
                        <button class="wishlist-toggle ${inWish ? 'liked' : ''}" data-id="${p.id}">${inWish ? '♥' : '♡'}</button>
                    </div>
                    <div class="product-info">
                        <div class="title">${p.title}</div>
                        <div class="price-row">
                            <span class="price">${formatPrice(p.price)}</span>
                            <button class="add-cart-btn ${inCart ? 'added' : ''}" data-id="${p.id}">${inCart ? '✓ In Cart' : '🛒 Add'}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGallery() {
            const params = new URLSearchParams(window.location.search);
            let search = params.get('search') || '';

            let filtered = [...paintings];
            if (search.trim()) {
                const q = search.trim().toLowerCase();
                filtered = filtered.filter(p => p.title.toLowerCase().includes(q));
                searchInput.value = search;
            }

            const adminLink = (currentUser && isUserAdmin(currentUser))
                ? `<p style="margin-bottom:12px;">Start uploading your collection in the Admin Studio.</p><a href="admin.html" style="color:var(--accent);font-weight:600;">Go to Admin Studio →</a>`
                : `<p style="margin-bottom:4px; font-size:14px;">Please check back soon for new original paintings!</p>`;

            galleryGrid.innerHTML = filtered.length ?
                filtered.map(p => renderProductCard(p)).join('') :
                `<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:var(--secondary);">
                    <div style="font-size:40px;margin-bottom:8px;">🎨</div>
                    <h3 style="font-size:20px;color:var(--primary);margin-bottom:6px;">No paintings found</h3>
                    ${adminLink}
                </div>`;
            gallerySub.textContent = filtered.length ?
                `Showing ${filtered.length} of ${paintings.length} original works` :
                'No matches found';
        }

        function updateBadges() {
            cartBadge.textContent = getCartCount();
            wishlistBadge.textContent = wishlist.length;
        }

        function updateLoginButton() {
            loginBtn.textContent = isLoggedIn ? 'Sign Out' : 'Sign In';
        }

        document.addEventListener('click', function(e) {
            const wishBtn = e.target.closest('.wishlist-toggle');
            if (wishBtn) {
                e.preventDefault();
                const id = parseInt(wishBtn.dataset.id);
                toggleWishlist(id);
                return;
            }

            const addBtn = e.target.closest('.add-cart-btn');
            if (addBtn) {
                e.preventDefault();
                const id = parseInt(addBtn.dataset.id);
                toggleCart(id);
                return;
            }

            if (e.target.id === 'loginNavBtn') {
                if (isLoggedIn) {
                    logOut().then(() => showToast('Signed out.'));
                } else {
                    location.href = 'signin.html';
                }
                return;
            }
        });

        async function addToCart(id) {
            const p = getPainting(id);
            if (!p) return;
            const existing = cart.find(i => i.id === id);
            if (existing) existing.qty += 1;
            else cart.push({ id, qty: 1, price: p.price });
            saveState('justart_cart', cart);
            if (currentUser) {
                try {
                    await apiAddToCart(id, existing ? existing.qty : 1);
                } catch (e) {
                    console.error('MySQL save failed', e);
                    showToast('⚠️ Could not sync to your account — saved locally only.');
                }
            }
            renderGallery();
            updateBadges();
            showToast(`🛒 "${p.title}" added to cart`);
        }

        function toggleCart(id) {
            if (isInCart(id)) removeFromCart(id);
            else addToCart(id);
        }

        async function removeFromCart(id) {
            const p = getPainting(id);
            cart = cart.filter(i => i.id !== id);
            saveState('justart_cart', cart);
            if (currentUser) {
                try {
                    await apiRemoveFromCart(id);
                } catch (e) {
                    console.error('MySQL save failed', e);
                }
            }
            renderGallery();
            updateBadges();
            if (p) showToast(`🗑️ "${p.title}" removed from cart`);
        }

        async function toggleWishlist(id) {
            const p = getPainting(id);
            if (!p) return;
            if (isInWishlist(id)) {
                wishlist = wishlist.filter(i => i.id !== id);
                saveState('justart_wishlist', wishlist);
                if (currentUser) {
                    try {
                        await apiRemoveFromWishlist(id);
                    } catch (e) {
                        console.error('MySQL save failed', e);
                    }
                }
                showToast(`♡ "${p.title}" removed from wishlist`);
            } else {
                wishlist.push({ id });
                saveState('justart_wishlist', wishlist);
                if (currentUser) {
                    try {
                        await apiAddToWishlist(id);
                    } catch (e) {
                        console.error('MySQL save failed', e);
                    }
                }
                showToast(`♥ "${p.title}" added to wishlist`);
            }
            renderGallery();
            updateBadges();
        }

        function doSearch() {
            const query = searchInput.value.trim();
            let url = 'gallerypage.html';
            if (query) url += '?search=' + encodeURIComponent(query);
            location.href = url;
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

        watchAuth(async (user) => {
            currentUser = user;
            isLoggedIn = !!user;
            updateLoginButton();

            // Show Studio link ONLY if authenticated as admin (mkiruthika659@gmail.com)
            const adminNavSlot = document.getElementById('adminNavSlot');
            const adminFooterSlot = document.getElementById('adminFooterSlot');
            if (user && isUserAdmin(user)) {
                if (adminNavSlot) adminNavSlot.innerHTML = `<a href="admin.html" style="color:var(--accent);font-weight:600;">✨ Studio</a>`;
                if (adminFooterSlot) adminFooterSlot.innerHTML = `<a href="admin.html" style="color:var(--accent);transition:color 0.3s;">Admin Studio</a>`;
            } else {
                if (adminNavSlot) adminNavSlot.innerHTML = '';
                if (adminFooterSlot) adminFooterSlot.innerHTML = '';
            }

            if (user) {
                try {
                    const data = await loadUserData(user.uid, user.email);
                    cart = data.cart;
                    wishlist = data.wishlist;
                    saveState('justart_cart', cart);
                    saveState('justart_wishlist', wishlist);
                } catch (e) {
                    console.error('Load failed, using local cache', e);
                }
            } else {
                cart = loadState('justart_cart', []);
                wishlist = loadState('justart_wishlist', []);
            }

            renderGallery();
            updateBadges();
        });

        async function init() {
            try {
                paintings = await fetchPaintings();
            } catch (e) {
                console.warn('Error loading paintings', e);
            }
            renderGallery();
            updateBadges();
            updateLoginButton();
            document.querySelector('.nav-links a[href="gallerypage.html"]')?.classList.add('active');
            const params = new URLSearchParams(window.location.search);
            if (params.has('search')) searchInput.value = params.get('search');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        console.log('✦ Just Art — Gallery (MySQL Database connected)');
    </script>
</body>
</html>
