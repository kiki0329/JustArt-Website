<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Shopping Cart | Just Art — Original Paintings</title>
    <meta name="description" content="Review the paintings in your cart. Complete your purchase of original artworks at Just Art." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="cartpage.html" />
    <link rel="icon" href="logo.png" type="image/png" />
    <meta property="og:title" content="Shopping Cart | Just Art" />
    <meta property="og:description" content="Review and purchase your selected paintings at Just Art." />
    <meta property="og:image" content="logo.png" />
    <meta name="twitter:card" content="summary" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', 'Times New Roman', serif; background: #F0F4F8; color: #1E293B; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; }
        input { font-family: inherit; outline: none; border: none; }
        img { display: block; max-width: 100%; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #E2E8F0; }
        ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 4px; }
        :root {
            --primary: #1E293B; --secondary: #334155; --accent: #3B82F6; --accent-hover: #2563EB;
            --accent-light: #DBEAFE; --cream: #F8FAFC; --warm-white: #F1F5F9;
            --shadow: 0 10px 40px rgba(30, 41, 59, 0.08); --radius: 12px; --transition: 0.35s ease; --border-color: #E2E8F0;
        }
        .app { max-width: 1440px; margin: 0 auto; padding: 0 24px 60px; }
        .header {
            display: flex; align-items: center; justify-content: space-between; padding: 20px 0 16px;
            border-bottom: 2px solid var(--accent-light); flex-wrap: wrap; gap: 12px 20px;
            position: sticky; top: 0; background: rgba(248, 250, 252, 0.94); backdrop-filter: blur(10px); z-index: 100;
        }
        .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-img { width: 48px; height: 48px; object-fit: contain; mix-blend-mode: multiply; }
        .logo-text { font-size: 28px; font-weight: 700; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; font-family: 'Georgia', serif; padding-right: 16px; }
        .nav-links { display: flex; gap: 24px; font-size: 15px; font-weight: 500; letter-spacing: 1px; color: var(--primary); }
        .nav-links a { padding: 4px 0; border-bottom: 2px solid transparent; transition: var(--transition); position: relative; }
        .nav-links a:hover, .nav-links a.active { border-bottom-color: var(--accent); color: var(--accent); }
        .header-actions { display: flex; align-items: center; gap: 18px; }
        .search-wrap { display: flex; align-items: center; background: var(--warm-white); border-radius: 40px; padding: 4px 16px 4px 18px; border: 1px solid var(--border-color); transition: var(--transition); }
        .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
        .search-wrap input { background: transparent; padding: 8px 6px; font-size: 14px; width: 150px; color: var(--primary); }
        .search-wrap input::placeholder { color: #94A3B8; font-style: italic; }
        .search-wrap button { font-size: 18px; color: var(--secondary); padding: 4px 0 4px 8px; transition: var(--transition); }
        .search-wrap button:hover { color: var(--accent); }
        .icon-btn { font-size: 22px; position: relative; color: var(--primary); transition: var(--transition); padding: 4px; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { color: var(--accent); transform: scale(1.05); }
        .badge { position: absolute; top: -6px; right: -8px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Arial', sans-serif; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4); }
        .login-btn { background: var(--primary); color: #fff; padding: 8px 22px; border-radius: 40px; font-size: 14px; font-weight: 500; letter-spacing: 1px; transition: var(--transition); }
        .login-btn:hover { background: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3); }
        .page { animation: fadeUp 0.5s ease forwards; padding-top: 30px; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 28px; font-weight: 700; color: var(--primary); letter-spacing: 1px; margin-bottom: 8px; position: relative; display: inline-block; }
        .section-title::after { content: ''; display: block; width: 50px; height: 3px; background: var(--accent); margin-top: 6px; }
        .section-header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
        .section-sub { color: var(--secondary); font-style: italic; font-size: 15px; }
        .cart-empty { text-align: center; padding: 60px 20px; color: var(--secondary); }
        .cart-empty .empty-icon { font-size: 60px; display: block; margin-bottom: 16px; }
        .cart-empty h3 { font-size: 24px; color: var(--primary); margin-bottom: 6px; }
        .cart-item { display: flex; align-items: center; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .cart-item .ci-img { width: 80px; height: 80px; border-radius: 8px; flex-shrink: 0; background: var(--warm-white); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .cart-item .ci-img img { width: 100%; height: 100%; object-fit: contain; }
        .cart-item .ci-info { flex: 1; min-width: 150px; }
        .cart-item .ci-info h4 { font-size: 16px; font-weight: 600; }
        .cart-item .ci-info p { color: var(--secondary); font-size: 14px; }
        .cart-item .ci-qty { display: flex; align-items: center; gap: 10px; }
        .cart-item .ci-qty button { width: 30px; height: 30px; border-radius: 50%; background: var(--warm-white); border: 1px solid var(--border-color); font-size: 16px; transition: var(--transition); display: flex; align-items: center; justify-content: center; }
        .cart-item .ci-qty button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .cart-item .ci-qty span { font-weight: 600; width: 24px; text-align: center; }
        .cart-item .ci-price { font-weight: 700; font-size: 18px; min-width: 80px; text-align: right; }
        .cart-item .ci-remove { color: #94A3B8; font-size: 20px; padding: 4px 8px; transition: var(--transition); }
        .cart-item .ci-remove:hover { color: #EF4444; }
        .cart-total { display: flex; justify-content: flex-end; align-items: center; gap: 30px; padding: 20px 0; font-size: 20px; font-weight: 700; border-top: 2px solid var(--accent-light); margin-top: 12px; flex-wrap: wrap; }
        .cart-total .checkout-btn { background: var(--accent); color: #fff; padding: 14px 44px; border-radius: 40px; font-size: 16px; font-weight: 600; letter-spacing: 1px; transition: var(--transition); }
        .cart-total .checkout-btn:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(59, 130, 246, 0.35); }
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: #fff; padding: 14px 28px; border-radius: 40px; font-size: 14px; box-shadow: 0 8px 30px rgba(30, 41, 59, 0.25); transform: translateY(80px); opacity: 0; transition: all 0.4s ease; z-index: 999; pointer-events: none; font-weight: 500; letter-spacing: 0.5px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        @media (max-width: 900px) {
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .nav-links { justify-content: center; flex-wrap: wrap; gap: 12px 20px; }
            .header-actions { justify-content: center; flex-wrap: wrap; }
            .search-wrap input { width: 120px; }
        }
        @media (max-width: 540px) {
            .app { padding: 0 14px 40px; }
            .logo-text { font-size: 22px; padding-right: 10px; }
            .nav-links { font-size: 13px; gap: 10px 14px; }
            .header-actions { gap: 10px; }
            .search-wrap input { width: 80px; font-size: 13px; }
            .cart-item { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 0; }
            .cart-item .ci-price { text-align: left; }
            .cart-total { flex-direction: column; align-items: stretch; gap: 14px; }
            .cart-total .checkout-btn { width: 100%; text-align: center; }
            .section-title { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="toast" id="toast"></div>
        <header class="header">
            <a href="homepage.html" class="logo-wrap">
                <img src="logo.png" class="logo-img" alt="Just Art Logo" />
                <span class="logo-text">Just Art</span>
            </a>
            <nav class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="gallerypage.html">Gallery</a>
                <a href="wishlistpage.html">Wishlist</a>
                <a href="cartpage.html" class="active">Cart</a>
            </nav>
            <div class="header-actions">
                <div class="search-wrap">
                    <input type="text" id="searchInput" placeholder="Search…" />
                    <button id="searchBtn" aria-label="Search paintings">🔍</button>
                </div>
                <button class="icon-btn" onclick="location.href='wishlistpage.html'" aria-label="View wishlist">
                    ♡ <span class="badge" id="wishlistBadge">0</span>
                </button>
                <button class="icon-btn" onclick="location.href='cartpage.html'" aria-label="View cart">
                    🛒 <span class="badge" id="cartBadge">0</span>
                </button>
                <button class="login-btn" id="loginNavBtn">Sign In</button>
            </div>
        </header>

        <main class="page">
            <div class="section-header">
                <div>
                    <h1 class="section-title">Your Cart</h1>
                    <p class="section-sub" id="cartSub">Review your selections</p>
                </div>
            </div>
            <div id="cartContainer"></div>
        </main>

        <footer style="text-align:center; padding:30px 0 20px; color:#94A3B8; font-size:13px; border-top:1px solid var(--border-color); margin-top:40px;">
            <p>&copy; 2026 Just Art. All rights reserved. | Original paintings from talented artists worldwide.</p>
            <nav aria-label="Footer navigation" style="margin-top:12px;display:flex;justify-content:center;gap:18px;font-size:13px;">
                <a href="homepage.html" style="color:#64748B;transition:color 0.3s;">Home</a>
                <a href="gallerypage.html" style="color:#64748B;transition:color 0.3s;">Gallery</a>
                <a href="cartpage.html" style="color:#64748B;transition:color 0.3s;">Cart</a>
                <a href="wishlistpage.html" style="color:#64748B;transition:color 0.3s;">Wishlist</a>
                <a href="signin.html" style="color:#64748B;transition:color 0.3s;">Sign In</a>
            </nav>
        </footer>
    </div>

    <script type="module">
        import { watchAuth, loadUserData, saveUserData, logOut, apiUpdateCartQty, apiRemoveFromCart, apiClearCart, fetchPaintings, defaultPaintings } from './db-common.js';

        let paintings = defaultPaintings;

        function loadState(key, defaultVal) {
            try { const data = localStorage.getItem(key); return data ? JSON.parse(data) : defaultVal; } catch { return defaultVal; }
        }
        function saveState(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

        let cart = loadState('justart_cart', []);
        let wishlist = loadState('justart_wishlist', []);
        let currentUser = null;
        let isLoggedIn = false;

        async function persist() {
            saveState('justart_cart', cart);
            saveState('justart_wishlist', wishlist);
            if (currentUser) {
                try { await saveUserData(currentUser.uid, { cart, wishlist }); }
                catch (e) {
                    console.error('Firestore save failed', e);
                    showToast('⚠️ Could not sync to your account — saved locally only.');
                }
            }
        }

        const $ = id => document.getElementById(id);
        const toastEl = $('toast');
        const cartBadge = $('cartBadge');
        const wishlistBadge = $('wishlistBadge');
        const loginBtn = $('loginNavBtn');
        const cartContainer = $('cartContainer');
        const cartSub = $('cartSub');
        const searchInput = $('searchInput');
        const searchBtn = $('searchBtn');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), 2600);
        }

        function formatPrice(n) { return '$' + Number(n).toLocaleString('en-US'); }
        function getPainting(id) { return paintings.find(p => p.id === id); }
        function getCartTotal() { return cart.reduce((sum, i) => sum + i.price * i.qty, 0); }
        function getCartCount() { return cart.reduce((sum, i) => sum + i.qty, 0); }

        function renderCart() {
            if (!cart.length) {
                cartContainer.innerHTML = `
                    <div class="cart-empty">
                        <span class="empty-icon">🛒</span>
                        <h3>Your cart is empty</h3>
                        <p>Start exploring our gallery and add pieces you love.</p>
                        <a href="gallerypage.html" style="display:inline-block;margin-top:14px;color:var(--accent);font-weight:600;">Browse Gallery →</a>
                    </div>
                `;
                cartSub.textContent = 'No items yet';
                return;
            }
            let html = '';
            cart.forEach(item => {
                const p = getPainting(item.id);
                if (!p) return;
                html += `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="ci-img"><img src="${p.image}" alt="${p.title}" /></div>
                        <div class="ci-info">
                            <h4>${p.title}</h4>
                            <p>by ${p.artist} · ${p.category}</p>
                        </div>
                        <div class="ci-qty">
                            <button class="ci-dec" data-id="${item.id}">−</button>
                            <span>${item.qty}</span>
                            <button class="ci-inc" data-id="${item.id}">+</button>
                        </div>
                        <div class="ci-price">${formatPrice(p.price * item.qty)}</div>
                        <button class="ci-remove" data-id="${item.id}">✕</button>
                    </div>
                `;
            });
            const total = getCartTotal();
            html += `
                <div class="cart-total">
                    <span>Total: <strong>${formatPrice(total)}</strong></span>
                    <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout →</button>
                </div>
            `;
            cartContainer.innerHTML = html;
            cartSub.textContent = `${getCartCount()} items · ${formatPrice(total)}`;
        }

        function updateBadges() {
            cartBadge.textContent = getCartCount();
            wishlistBadge.textContent = wishlist.length;
        }

        function updateLoginButton() {
            loginBtn.textContent = isLoggedIn ? 'Sign Out' : 'Sign In';
        }

        document.addEventListener('click', async function(e) {
            const inc = e.target.closest('.ci-inc');
            if (inc) {
                const id = parseInt(inc.dataset.id);
                updateCartQty(id, 1);
                return;
            }
            const dec = e.target.closest('.ci-dec');
            if (dec) {
                const id = parseInt(dec.dataset.id);
                updateCartQty(id, -1);
                return;
            }
            const rem = e.target.closest('.ci-remove');
            if (rem) {
                const id = parseInt(rem.dataset.id);
                removeFromCart(id);
                return;
            }
            if (e.target.id === 'checkoutBtn') {
                if (cart.length === 0) { showToast('Your cart is empty.'); return; }
                showToast('🎉 Order placed! Thank you for your purchase.');
                cart = [];
                saveState('justart_cart', cart);
                if (currentUser) {
                    try {
                        await apiClearCart();
                    } catch (e) {
                        console.error('MySQL clear failed', e);
                    }
                }
                renderCart();
                updateBadges();
                return;
            }
            if (e.target.id === 'loginNavBtn') {
                if (isLoggedIn) {
                    logOut().then(() => showToast('Signed out.'));
                } else {
                    location.href = 'signin.html';
                }
                return;
            }
        });

        async function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                await removeFromCart(id);
                return;
            }
            saveState('justart_cart', cart);
            if (currentUser) {
                try {
                    await apiUpdateCartQty(id, item.qty);
                } catch (e) {
                    console.error('MySQL save failed', e);
                }
            }
            renderCart();
            updateBadges();
        }

        async function removeFromCart(id) {
            const p = getPainting(id);
            cart = cart.filter(i => i.id !== id);
            saveState('justart_cart', cart);
            if (currentUser) {
                try {
                    await apiRemoveFromCart(id);
                } catch (e) {
                    console.error('MySQL save failed', e);
                }
            }
            renderCart();
            updateBadges();
            if (p) showToast(`🗑️ "${p.title}" removed from cart`);
        }

        function doSearch() {
            const query = searchInput.value.trim();
            if (query) location.href = `gallerypage.html?search=${encodeURIComponent(query)}`;
        }
        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

        watchAuth(async (user) => {
            currentUser = user;
            isLoggedIn = !!user;
            updateLoginButton();

            if (user) {
                try {
                    const data = await loadUserData(user.uid, user.email);
                    cart = data.cart;
                    wishlist = data.wishlist;
                    saveState('justart_cart', cart);
                    saveState('justart_wishlist', wishlist);
                } catch (e) {
                    console.error('MySQL load failed, using local cache', e);
                    showToast('⚠️ Could not reach your saved data — using local cache.');
                }
            } else {
                cart = loadState('justart_cart', []);
                wishlist = loadState('justart_wishlist', []);
            }

            renderCart();
            updateBadges();
        });

        async function init() {
            try {
                paintings = await fetchPaintings();
            } catch (e) {
                console.warn('Using default paintings', e);
            }
            renderCart();
            updateBadges();
            updateLoginButton();
            document.querySelector('.nav-links a[href="cartpage.html"]')?.classList.add('active');
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();

        console.log('✦ Just Art — Cart (MySQL Database connected)');
    </script>
</body>
</html>
